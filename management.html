<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Manage user</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      padding: 40px 20px;
      color: white;
    }

    h1, h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .user-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .user-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
      color: #fff;
      position: relative;
    }

    .user-card h3 {
      margin: 0 0 10px;
      font-size: 1.2rem;
    }

    .user-card p {
      margin: 4px 0;
      color: #eee;
    }

    .actions {
      margin-top: 10px;
    }

    .actions a {
      margin-right: 12px;
      color: #fff;
      text-decoration: none;
      font-weight: 500;
    }

    .actions a:hover {
      text-decoration: underline;
    }

    .add-user {
      display: block;
      text-align: center;
      margin-top: 30px;
      text-decoration: none;
      font-weight: bold;
      color: #fff;
      font-size: 16px;
    }

    .form-box {
      max-width: 500px;
      margin: 40px auto;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
      display: none;
    }

    .form-box label {
      display: block;
      margin-top: 10px;
      font-weight: 500;
      color: #fff;
    }

    .form-box input, .form-box select {
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      outline: none;
    }

    .form-box button {
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      background: #ffffff;
      color: #0072ff;
      border: none;
      font-weight: 600;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .form-box button:hover {
      background-color: #e0e0e0;
    }

    @media (max-width: 480px) {
      .user-grid {
        padding: 10px;
      }

      h1 {
        font-size: 22px;
      }

      h2 {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>

  <h1>Online Exam System by Kaoutar</h1>
  <h2>👥 Manage user</h2>

  <div class="user-grid" id="tableuser"></div>

  <a href="register.html" class="add-user">➕ Add New User</a>

  <div class="form-box" id="formEditarBox">
    <h3>Edit User</h3>
    <form id="formEditar">
      <input type="hidden" id="editId" />
      <label>Name:</label>
      <input type="text" id="editName" required />

      <label>email:</label>
      <input type="email" id="editemail" required />

      <label>Role:</label>
      <select id="editRole" required>
        <option value="student">Student</option>
        <option value="teacher">Teacher</option>
        <option value="admin">Administrator</option>
      </select>

      <button type="submit">Save Changes</button>
    </form>
  </div>

  <script>
    const userContainer = document.getElementById('tableuser');
    const formBox = document.getElementById('formEditarBox');

    function loaduser() {
      fetch('listUser.php')
        .then(response => response.json())
        .then(data => {
          userContainer.innerHTML = '';
          data.forEach(u => {
            userContainer.innerHTML += `
              <div class="user-card">
                <h3>${u.name}</h3>
                <p><strong>ID:</strong> ${u.id}</p>
                <p><strong>email:</strong> ${u.email}</p>
                <p><strong>Role:</strong> ${u.role}</p>
                <div class="actions">
                  <a onclick="fillEditForm(${u.id}, '${u.name}', '${u.email}', '${u.role}')">✏️ Edit</a>
                  <a onclick="confirmDeletion(${u.id})">🗑️ Delete</a>
                </div>
              </div>`;
          });
        });
    }

    function fillEditForm(id, name, email, role) {
      document.getElementById('editId').value = id;
      document.getElementById('editName').value = name;
      document.getElementById('editemail').value = email;
      document.getElementById('editRole').value = role;
      formBox.style.display = 'block';
      window.scrollTo({ top: formBox.offsetTop - 20, behavior: 'smooth' });
    }

    document.getElementById('formEditar').addEventListener('submit', function (e) {
      e.preventDefault();

      const data = {
        id: document.getElementById('editId').value,
        name: document.getElementById('editName').value,
        email: document.getElementById('editemail').value,
        role: document.getElementById('editRole').value
      };

      fetch('editUser.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
      .then(res => res.json())
      .then(response => {
        if (response.success) {
          alert("✅ User updated successfully!");
          formBox.style.display = 'none';
          loaduser();
        } else {
          alert("❌ Error: " + response.error);
        }
      });
    });

    function confirmDeletion(id) {
      if (!confirm('Are you sure you want to delete this user?')) return;
      fetch('api/delete.php?id=' + encodeURIComponent(id))
        .then(response => response.text())
        .then(text => {
          try {
            const res = JSON.parse(text);
            if (res.success) {
              alert("🗑️ User deleted successfully!");
              loaduser();
            } else {
              alert("❌ Error: " + res.error);
            }
          } catch (e) {
            alert("⚠️ Invalid response from server.");
            console.error("Parse error:", e);
          }
        })
        .catch(error => {
          console.error("Error deleting:", error);
          alert("❌ Error deleting user.");
        });
    }

    document.addEventListener('DOMContentLoaded', loaduser);
  </script>
</body>
</html>
