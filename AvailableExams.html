<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Exams Available</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #667eea, #764ba2);
      padding: 40px 20px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    h2 {
      text-align: center;
      font-size: 28px;
      color: #ffffffee;
      margin-bottom: 30px;
    }

    .exam-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .exam-card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(6px);
      border-radius: 14px;
      padding: 20px;
      color: white;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s ease;
    }

    .exam-card:hover {
      transform: translateY(-5px);
    }

    .exam-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .exam-dates {
      font-size: 0.9rem;
      color: #ddd;
      margin-bottom: 15px;
    }

    .exam-card button {
      background-color: #ffffff;
      color: #764ba2;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95em;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .exam-card button:hover {
      background-color: #f0f0f0;
      color: #4b2980;
    }

    .no-exams {
      text-align: center;
      color: #ffffffcc;
      font-style: italic;
      font-size: 1rem;
    }

    @media (max-width: 700px) {
      .container {
        padding: 20px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <h2>📚 Current Exams</h2>
  <div id="examList" class="exam-grid"></div>
</div>

<script>
  fetch('listExams.php')
    .then(res => res.json())
    .then(list => {
      const container = document.getElementById('examList');
      if (list.length === 0) {
        container.innerHTML = "<p class='no-exams'>No exams available at this time.</p>";
        return;
      }

      list.forEach(ex => {
        container.innerHTML += `
          <div class="exam-card">
            <div class="exam-title">${ex.title}</div>
            <div class="exam-dates">Start: ${ex.start_date}<br>End: ${ex.end_date}</div>
            <button onclick="start(${ex.test_id})">▶ Start Exam</button>
          </div>
        `;
      });
    });

  function start(testId) {
    window.location.href = "DoExams.html?id=" + testId;
  }
</script>

</body>
</html>
