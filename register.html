<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Official Exam Website" />
  <meta name="keywords" content="Online Exams System" />
  <title>Register | Online Exams System</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .register-container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      width: 100%;
      max-width: 400px;
      color: white;
      text-align: center;
    }

    h1 {
      position: absolute;
      top: 20px;
      text-align: center;
      width: 100%;
      font-size: 24px;
      color: #ffffffee;
    }

    h2 {
      font-size: 26px;
      margin-bottom: 25px;
    }

    input,
    select {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 15px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      outline: none;
    }

    input::placeholder {
      color: #eee;
    }

    select option {
      background: white;
      color: black;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background-color: #ffffff;
      color: #0072ff;
      border: none;
      font-weight: 600;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: #e0e0e0;
    }

    .links {
      margin-top: 20px;
    }

    .links a {
      display: block;
      margin-top: 8px;
      color: #ffffffcc;
      text-decoration: none;
      font-size: 14px;
      transition: color 0.2s;
    }

    .links a:hover {
      text-decoration: underline;
      color: #fff;
    }

    @media (max-width: 480px) {
      .register-container {
        padding: 30px 20px;
      }

      h1 {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <h1>Online Exam System by Kaoutar</h1>

  <div class="register-container">
    <h2>Create Account</h2>
    <form id="registrationForm">
      <input type="text" id="name" placeholder="Full Name" required />
      <input type="email" id="email" placeholder="email" required />
      <input type="password" id="password" placeholder="Password" required />
      <select id="role" required>
        <option value="">Select Role</option>
        <option value="admin">Admin</option>
        <option value="teacher">Teacher</option>
        <option value="student">Student</option>
      </select>
      <button type="submit">Register</button>
    </form>

    <div class="links">
      <a href="firstPage.html">🔑 Already have an account? Login</a>
    </div>
  </div>

  <script>
    document.getElementById('registrationForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const role = document.getElementById('role').value;

      const data = { name, email, password, role };

      fetch('register.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
      .then(res => res.json())
      .then(response => {
        if (response.success) {
          alert("✅ User registered successfully!");
          document.getElementById('registrationForm').reset();
          window.location.href = "firstPage.html";
        } else {
          alert("❌ Error: " + response.error);
        }
      })
      .catch(error => {
        console.error("Request error:", error);
        alert("An error occurred while trying to register.");
      });
    });
  </script>
</body>
</html>
